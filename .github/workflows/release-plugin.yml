name: Build AutoPW Windows plugin package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build and smoke-test bundled package
        run: npm run package:plugin
      - name: Publish GitHub Release asset
        shell: pwsh
        run: |
          $asset = Get-ChildItem dist\autopw-win-x64-*.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $asset.FullName --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
